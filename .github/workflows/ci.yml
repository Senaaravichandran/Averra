name: Averra quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install web dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Compile application modules
        run: python -m py_compile backend/app.py backend/camera.py backend/wsgi.py backend/averra/__init__.py backend/averra/api.py backend/averra/db.py backend/averra/services/recognition.py scripts/run.py
