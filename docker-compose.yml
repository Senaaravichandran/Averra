services:
  averra:
    build: .
    image: averra:local
    env_file:
      - .env
    environment:
      AVERRA_ENV: production
      AVERRA_DATABASE: /app/instance/averra.sqlite3
      AVERRA_SEED_DEMO: "false"
    ports:
      - "8000:8000"
    volumes:
      - averra-data:/app/instance
    restart: unless-stopped
    init: true

volumes:
  averra-data:

